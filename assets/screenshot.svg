    <rect x="396" y="378" width="168" height="52" rx="0" fill="#ffffff" stroke="#e5e5ea"/>
    <text x="406" y="400" font-size="13" font-weight="600" fill="#1d1d1f">千与千寻</text>
    <text x="406" y="418" font-size="11" fill="#86868b">2001 · ★ 9.4</text>
  </g>
  <!-- 卡4 -->
  <g>
    <rect x="580" y="118" width="168" height="252" rx="10" fill="url(#g4)"/>
    <text x="664" y="260" font-size="52" font-weight="700" fill="#ffffff" opacity="0.9" text-anchor="middle">你</text>
