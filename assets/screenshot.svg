  <circle cx="34" cy="99" r="9" fill="none" stroke="#00bfa5" stroke-width="1.6"/>
  <text x="50" y="104" font-size="18" font-weight="600" fill="#1d1d1f">最近添加</text>
  <text x="1130" y="103" font-size="13" fill="#86868b">查看更多</text>

