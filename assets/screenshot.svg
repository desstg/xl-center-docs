  <!-- logo -->
  <path d="M28 25a3 3 0 0 0-3 3v18a3 3 0 0 0 3 3h24a3 3 0 0 0 3-3V34a3 3 0 0 0-3-3H42l-4-4h-7a3 3 0 0 0-3-3z" fill="#00a896"/>
  <text x="60" y="38" font-size="17" font-weight="700"><tspan fill="#00bfa5">XL</tspan><tspan fill="#1d1d1f"> Center</tspan></text>
  <!-- 导航项 -->
  <text x="230" y="38" font-size="14" font-weight="600" fill="#00bfa5">仪表板</text>
  <rect x="230" y="44" width="42" height="2" fill="#00bfa5"/>
  <text x="316" y="38" font-size="14" fill="#6e6e73">影片库</text>
  <text x="402" y="38" font-size="14" fill="#6e6e73">收藏夹</text>
  <text x="488" y="38" font-size="14" fill="#6e6e73">管理</text>
  <!-- 搜索框 -->
  <rect x="800" y="18" width="250" height="34" rx="9" fill="#ffffff" stroke="#a8e6cf"/>
  <circle cx="822" cy="35" r="6" fill="none" stroke="#86868b" stroke-width="1.5"/>
  <line x1="826.5" y1="39.5" x2="831" y2="44" stroke="#86868b" stroke-width="1.5"/>
  <text x="836" y="39" font-size="13" fill="#999999">搜索影片...</text>
  <rect x="1026" y="23" width="24" height="24" rx="6" fill="#a8e6cf"/>
  <!-- 图标按钮 -->
  <circle cx="1078" cy="35" r="16" fill="#c9379e"/>
  <circle cx="1112" cy="35" r="16" fill="#f0f5f9" stroke="#e5e5ea"/>

