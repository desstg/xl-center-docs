    <text x="1032" y="260" font-size="52" font-weight="700" fill="#ffffff" opacity="0.9" text-anchor="middle">霸</text>
    <rect x="948" y="378" width="168" height="52" rx="0" fill="#ffffff" stroke="#e5e5ea"/>
    <text x="958" y="400" font-size="13" font-weight="600" fill="#1d1d1f">霸王别姬</text>
    <text x="958" y="418" font-size="11" fill="#86868b">1993 · ★ 9.6</text>
  </g>

  <!-- ===== 统计区 ===== -->
  <!-- 面板1 -->
  <rect x="28" y="470" width="572" height="150" rx="12" fill="#ffffff" stroke="#e5e5ea"/>
  <text x="48" y="500" font-size="14" font-weight="600" fill="#1d1d1f">媒体总览</text>
  <rect x="120" y="488" width="40" height="18" rx="4" fill="#f0f5f9"/>
  <text x="127" y="501" font-size="10" fill="#86868b">Live</text>
  <rect x="48" y="518" width="168" height="84" rx="8" fill="#f5f5f7"/>
  <text x="132" y="556" font-size="26" font-weight="700" fill="#1d1d1f" text-anchor="middle">1248</text>
  <text x="132" y="578" font-size="11" fill="#86868b" text-anchor="middle">影片</text>
  <rect x="230" y="518" width="168" height="84" rx="8" fill="#f5f5f7"/>
  <text x="314" y="556" font-size="26" font-weight="700" fill="#1d1d1f" text-anchor="middle">342</text>
  <text x="314" y="578" font-size="11" fill="#86868b" text-anchor="middle">演员</text>
  <rect x="412" y="518" width="168" height="84" rx="8" fill="#f5f5f7"/>
  <text x="496" y="556" font-size="26" font-weight="700" fill="#1d1d1f" text-anchor="middle">86</text>
  <text x="496" y="578" font-size="11" fill="#86868b" text-anchor="middle">收藏</text>

  <!-- 面板2 -->
  <rect x="616" y="470" width="572" height="150" rx="12" fill="#ffffff" stroke="#e5e5ea"/>
  <text x="636" y="500" font-size="14" font-weight="600" fill="#1d1d1f">今日动态</text>
  <rect x="636" y="518" width="168" height="84" rx="8" fill="#f5f5f7"/>
  <text x="720" y="556" font-size="26" font-weight="700" fill="#1d1d1f" text-anchor="middle">12</text>
  <text x="720" y="578" font-size="11" fill="#86868b" text-anchor="middle">今日新增</text>
  <rect x="818" y="518" width="168" height="84" rx="8" fill="#f5f5f7"/>
  <text x="902" y="556" font-size="26" font-weight="700" fill="#1d1d1f" text-anchor="middle">47</text>
  <text x="902" y="578" font-size="11" fill="#86868b" text-anchor="middle">本周新增</text>
  <rect x="1000" y="518" width="168" height="84" rx="8" fill="#f5f5f7"/>
  <text x="1084" y="556" font-size="26" font-weight="700" fill="#1d1d1f" text-anchor="middle">203</text>
  <text x="1084" y="578" font-size="11" fill="#86868b" text-anchor="middle">本月新增</text>
